<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Truco argentino</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: mesa de bodegón de barrio, picante y simple
IDEA: el paño verde de la mesa de truco con naipes españoles
PICTURE: la mesa misma: tres bazas, tu mano abajo, la de la compu arriba
COLOUR and TYPE: paño verde, borde de madera, naipe claro, dorado de acento; Alfa Slab One + Barlow
LAYOUT: marcador arriba, mesa al centro, mano y cantos abajo, todo en una columna */
:root{color-scheme:dark;--felt:#1f6340;--felt2:#14472b;--wood:#4a2f1b;--card:#fbf7ec;--ink:#f6f1e4;--gold:#f3c34f;--red:#d8443a;--blue:#2d5a9c;--green:#3f7a2c}
*{box-sizing:border-box;min-width:0}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 38%,var(--felt) 0%,var(--felt2) 70%,#0c2e1a 100%) fixed;color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:10px 12px 18px;display:flex;flex-direction:column;gap:6px}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;background:rgba(0,0,0,.3);border:2px solid var(--wood);border-radius:14px;padding:8px 10px}
.sc{text-align:center}
.sc span{font-size:13px;opacity:.8;display:block}
.sc b{font:30px/1 'Alfa Slab One',serif;color:var(--gold)}
.sc i{font-style:normal;font-size:13px;opacity:.75}
.mid{text-align:center;font-size:13px;line-height:1.3;opacity:.9}
.mid strong{display:block;font-size:14px;color:var(--gold)}
.hand{display:flex;justify-content:center;gap:8px;min-height:40px}
.cpu .card{--w:min(14vw,54px)}
.say{height:40px;display:flex;align-items:center;justify-content:center}
.say div{background:var(--ink);color:#1b2a1f;font-weight:700;border-radius:20px;padding:6px 16px;font-size:17px;box-shadow:0 4px 10px rgba(0,0,0,.35);animation:pop .25s ease-out}
.say div small{font-weight:600;opacity:.6;margin-right:6px;font-size:13px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.table{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px;border-radius:18px;border:3px solid var(--wood);background:rgba(0,0,0,.12);box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
.baza{display:flex;flex-direction:column;align-items:center;gap:6px}
.baza .card,.slot{--w:min(19vw,74px)}
.slot{width:var(--w);aspect-ratio:2/3;border:2px dashed rgba(255,255,255,.18);border-radius:8px}
.res{font-size:13px;height:18px;opacity:.9}
.res.w{color:var(--gold)}.res.l{color:#ff9d93}
.note{min-height:20px;text-align:center;font-size:14px;color:var(--gold)}
.status{text-align:center;font-size:14px;opacity:.85;min-height:20px}
.me .card{--w:min(27vw,104px);transition:transform .15s}
.me button.card:not(:disabled):hover,.me button.card:not(:disabled):active{transform:translateY(-8px)}
.me button.card:disabled{filter:brightness(.82);cursor:default}
.me.on button.card{box-shadow:0 0 0 3px var(--gold),0 6px 14px rgba(0,0,0,.4)}
.card{width:var(--w);aspect-ratio:2/3;border-radius:9px;background:var(--card);position:relative;box-shadow:0 4px 10px rgba(0,0,0,.4);padding:0;overflow:hidden;flex:none}
.card::after{content:"";position:absolute;inset:3px;border:1.5px solid currentColor;border-radius:6px;opacity:.35;pointer-events:none}
.card .n{position:absolute;top:3%;left:8%;font:calc(var(--w)*.24)/1 'Alfa Slab One',serif}
.card .n2{top:auto;left:auto;bottom:3%;right:8%;transform:rotate(180deg)}
.card svg{position:absolute;left:22%;top:20%;width:56%;height:60%}
.s-oro{color:#b07a12}.s-copa{color:var(--red)}.s-espada{color:var(--blue)}.s-basto{color:var(--green)}
.back{background:repeating-linear-gradient(45deg,#9e2b25 0 6px,#b8372f 6px 12px);border:3px solid var(--card)}
.back::after{display:none}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1 1 0;min-height:48px;border-radius:12px;padding:8px 10px;font-weight:700;font-size:16px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.2)}
.row button.tr{background:var(--red);border-color:#ff7a6e}
.row button.q{background:var(--gold);color:#2a1d05;border-color:#ffe08f}
.row button.env{background:#2f5f8f;border-color:#6d9bd0}
.row button:disabled{opacity:.35;cursor:default}
.lbl{font-size:13px;opacity:.75;text-align:center}
.ov{position:fixed;inset:0;background:rgba(5,20,12,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov[hidden]{display:none}
.box{background:#fbf7ec;color:#1d2a20;border-radius:18px;padding:22px 20px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5);border:4px solid var(--wood)}
.box h1,.box h2{font:36px/1.05 'Alfa Slab One',serif;margin:0 0 8px;color:#1f6340}
.box h2{font-size:28px}
.box p{margin:6px 0 12px}
.box ul{list-style:none;padding:0;margin:8px 0 14px;text-align:left}
.box li{padding:6px 0;border-bottom:1px solid #e3dccb;display:flex;justify-content:space-between;gap:10px}
.box li b{white-space:nowrap}
.box .row button{background:#1f6340;color:#fff;border-color:#1f6340}
.box .row button.alt{background:#fff;color:#1f6340}
.box .mini{display:flex;justify-content:center;gap:6px;margin:6px 0 12px}
.box .mini .card{--w:56px}
.box small{display:block;font-size:13px;opacity:.7;margin-top:10px}
.big{font:44px/1 'Alfa Slab One',serif;margin:6px 0 10px;color:#1d2a20}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app">
  <div class="top" id="top"></div>
  <div class="hand cpu" id="cpu"></div>
  <div class="say" id="sayc"></div>
  <div class="table" id="tbl"></div>
  <div class="say" id="sayp"></div>
  <div class="note" id="note"></div>
  <div class="hand me" id="me"></div>
  <div class="status" id="status"></div>
  <div class="acts" id="acts"></div>
</div>
<div class="ov" id="ov"><div class="box" id="box"></div></div>
<script>
{
const SUITS=['espada','basto','oro','copa'],NUMS=[1,2,3,4,5,6,7,10,11,12];
const ICON={
oro:'<svg viewBox="0 0 40 60"><circle cx="20" cy="30" r="15" fill="#f0bf3c" stroke="#9a6b10" stroke-width="2.5"/><circle cx="20" cy="30" r="8" fill="none" stroke="#9a6b10" stroke-width="2"/><circle cx="20" cy="30" r="2.5" fill="#9a6b10"/></svg>',
copa:'<svg viewBox="0 0 40 60"><path d="M7 10h26q1 18-10 22v10h7v5H10v-5h7V32Q6 28 7 10z" fill="#d8443a" stroke="#8c1f18" stroke-width="2" stroke-linejoin="round"/><path d="M10 14h20" stroke="#f3c34f" stroke-width="2.5"/></svg>',
espada:'<svg viewBox="0 0 40 60"><path d="M20 2l5 9v30h-10V11z" fill="#a9c0de" stroke="#1f3f72" stroke-width="2" stroke-linejoin="round"/><rect x="7" y="40" width="26" height="5" rx="2" fill="#1f3f72"/><rect x="17.5" y="45" width="5" height="9" fill="#c79a3a"/><circle cx="20" cy="56" r="3.5" fill="#1f3f72"/></svg>',
basto:'<svg viewBox="0 0 40 60"><path d="M15 56Q11 32 13 9q7-8 14 0 1 24-5 47z" fill="#6f9a3f" stroke="#2f4f17" stroke-width="2" stroke-linejoin="round"/><circle cx="16" cy="22" r="2.4" fill="#2f4f17"/><circle cx="23" cy="34" r="2.4" fill="#2f4f17"/><circle cx="17" cy="45" r="2.2" fill="#2f4f17"/></svg>'};
const $=id=>document.getElementById(id);
const other=w=>w==='p'?'c':'p';
const WHO={p:'Vos',c:'Compu'};
const TL={2:'Truco',3:'Retruco',4:'Vale cuatro'};
const TN={2:'¡Truco!',3:'¡Quiero retruco!',4:'¡Quiero vale cuatro!'};
const EV={E:2,R:3},EN={E:'Envido',R:'Real envido',F:'Falta envido'};
function str(c){const n=c.n,s=c.s;
 if(n===1&&s==='espada')return 14;if(n===1&&s==='basto')return 13;if(n===7&&s==='espada')return 12;if(n===7&&s==='oro')return 11;
 return {3:10,2:9,1:8,12:7,11:6,10:5,7:4,6:3,5:2,4:1}[n]}
const ev=c=>c.n>=10?0:c.n;
function envPts(h){let b=Math.max(...h.map(ev));for(let i=0;i<h.length;i++)for(let j=i+1;j<h.length;j++)if(h[i].s===h[j].s)b=Math.max(b,20+ev(h[i])+ev(h[j]));return b}
const DECK=[];SUITS.forEach(s=>NUMS.forEach(n=>DECK.push({n,s})));
const Q={};for(let v=1;v<=14;v++){let lo=0,eq=0;DECK.forEach(c=>{const x=str(c);if(x<v)lo++;else if(x===v)eq++});Q[v]=(lo+.5*Math.max(0,eq-1))/39}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let G=null,lastTarget=15;
try{lastTarget=+localStorage.getItem('truco-target')||15}catch(e){}

function newMatch(t){lastTarget=t;try{localStorage.setItem('truco-target',t)}catch(e){}
 G={target:t,sp:0,sc:0,mano:Math.random()<.5?'p':'c',over:false};newHand()}
function newHand(){
 G.mano=other(G.mano);
 const d=shuffle(DECK.map(c=>({...c})));
 G.hand={p:d.slice(0,3),c:d.slice(3,6)};G.orig={p:[...G.hand.p],c:[...G.hand.c]};
 G.played={p:[],c:[]};G.round=0;G.results=[];G.turn=G.mano;G.truco={lvl:1,owner:null};G.env={done:false};
 G.pending=null;G.saved=null;G.handOver=false;G.awards=[];G.cpuEnvTried=false;G.cpuTr={};G.note='';
 G.say={p:'',c:''};G.say[G.mano]='Soy mano';
 $('ov').hidden=true;continueTurn()}
function say(w,t){G.say={p:'',c:''};G.say[w]=t}
function award(w,pts,why){G['s'+w]+=pts;G.awards.push({w,pts,why})}
function checkMatch(){if(G.sp>=G.target||G.sc>=G.target){G.over=true;G.handOver=true;G.pending=null;render();setTimeout(showEnd,900);return true}return false}
function endHand(w,why){if(G.ended)return;award(w,G.truco.lvl,why);G.handOver=true;G.pending=null;if(checkMatch())return;render();setTimeout(showHand,900)}
function continueTurn(){G.ended=false;render();if(G.handOver||G.pending)return;if(G.turn==='c'){clearTimeout(G.tm);G.tm=setTimeout(cpuTurn,900)}}
function ask(w){render();if(w==='c'){clearTimeout(G.tm);G.tm=setTimeout(cpuRespond,1100)}}

function canRaiseTruco(w){return G.truco.lvl<4&&(G.truco.lvl===1||G.truco.owner===w)}
function callTruco(w){G.pending={t:'tr',by:w,lvl:G.truco.lvl+1};say(w,TN[G.pending.lvl]);ask(other(w))}
function respTruco(w,a){const P=G.pending;
 if(a==='q'){G.truco.lvl=P.lvl;G.truco.owner=w;G.pending=null;say(w,'¡Quiero!');continueTurn()}
 else if(a==='n'){say(w,'No quiero');endHand(P.by,TL[P.lvl]+' no querido')}
 else{G.truco.lvl=P.lvl;G.truco.owner=null;G.pending={t:'tr',by:w,lvl:P.lvl+1};say(w,TN[P.lvl+1]);ask(other(w))}}

function canEnvido(w){return G.round===0&&!G.env.done&&G.truco.lvl===1&&!G.played[w][0]}
function envOptions(ch){if(!ch||!ch.length)return['E','R','F'];const l=ch[ch.length-1];if(l==='F')return[];if(l==='R')return['F'];return ch.filter(k=>k==='E').length>=2?['R','F']:['E','R','F']}
function callEnvido(w,k){
 if(G.pending&&G.pending.t==='tr'){G.saved=G.pending;G.pending=null}
 if(G.pending&&G.pending.t==='env'){G.pending.chain.push(k);G.pending.by=w}else G.pending={t:'env',by:w,chain:[k]};
 say(w,'¡'+EN[k]+'!');ask(other(w))}
function faltaPts(win){const lead=Math.max(G.sp,G.sc);if(G.target===30&&lead<15)return G.target-G['s'+win];return G.target-lead}
function respEnv(w,a){const P=G.pending,last=P.chain[P.chain.length-1];
 if(a==='q'){const ep=envPts(G.orig.p),ec=envPts(G.orig.c);const win=ep>ec?'p':ec>ep?'c':G.mano;
  const pts=last==='F'?faltaPts(win):P.chain.reduce((s,k)=>s+EV[k],0);
  say(w,'¡Quiero!');award(win,pts,'Envido: vos '+ep+', compu '+ec);
  G.note='Envido — Vos '+ep+' · Compu '+ec+(ep===ec?' (gana el mano)':'')+' → '+WHO[win]+' +'+pts;finishEnv()}
 else if(a==='n'){const pts=P.chain.length===1?1:P.chain.slice(0,-1).reduce((s,k)=>s+EV[k],0);
  say(w,'No quiero');award(P.by,pts,EN[last]+' no querido');G.note=WHO[P.by]+' +'+pts+' por el envido';finishEnv()}
 else callEnvido(w,a)}
function finishEnv(){G.env.done=true;G.pending=null;if(checkMatch())return;
 if(G.saved){G.pending=G.saved;G.saved=null;const b=G.pending.by;setTimeout(()=>{if(G.pending&&!G.handOver){say(b,'Y el '+TL[G.pending.lvl].toLowerCase()+', ¿querés?');ask(other(b))}},1100);render()}
 else continueTurn()}
function mazo(w){say(w,'Me voy al mazo');endHand(other(w),WHO[w]+' se fue al mazo')}

function playCard(w,i){if(G.handOver)return;const c=G.hand[w].splice(i,1)[0];G.played[w][G.round]=c;say(w,'');
 if(G.played[other(w)][G.round])resolveRound();else{G.turn=other(w);continueTurn()}}
function handWinner(){const r=G.results,p=r.filter(x=>x==='p').length,c=r.filter(x=>x==='c').length;
 if(p>=2)return'p';if(c>=2)return'c';
 if(r.length>=2){if(r[0]==='t'&&r[1]!=='t')return r[1];if(r[0]!=='t'&&r[1]==='t')return r[0]}
 if(r.length===3){if(p>c)return'p';if(c>p)return'c';return r[0]!=='t'?r[0]:G.mano}
 return null}
function resolveRound(){const a=str(G.played.p[G.round]),b=str(G.played.c[G.round]);const r=a>b?'p':b>a?'c':'t';G.results.push(r);
 const w=handWinner();
 if(w){G.handOver=true;render();setTimeout(()=>endHand(w,'Ganó las bazas'+(G.truco.lvl>1?' ('+TL[G.truco.lvl]+')':'')),800);return}
 G.round++;G.turn=r==='t'?G.mano:r;continueTurn()}

/* ---- Compu ---- */
function cpuPower(){const r=G.results,won=r.filter(x=>x==='c').length,lost=r.filter(x=>x==='p').length;
 if(lost>=2)return 0;if(won>=2)return 1;
 let rem=G.hand.c.map(str).sort((a,b)=>b-a);const probs=[];const x=G.played.p[G.round],mine=G.played.c[G.round];
 if(mine)probs.push(Q[str(mine)]);
 else if(x){const xv=str(x),best=rem[0];probs.push(best>xv?1:best===xv?.5:0);rem=rem.slice(1)}
 rem.forEach(v=>probs.push(Q[v]));
 const left=probs.slice(0,3-r.length);
 if(r.includes('t')&&won===0)return left[0]??.5;
 const need=2-won;let dist=[1];
 left.forEach(p=>{const n=new Array(dist.length+1).fill(0);dist.forEach((d,k)=>{n[k]+=d*(1-p);n[k+1]+=d*p});dist=n});
 return dist.reduce((s,d,k)=>s+(k>=need?d:0),0)}
function chooseCard(){const h=G.hand.c.map((c,i)=>({i,v:str(c)})).sort((a,b)=>a.v-b.v);const x=G.played.p[G.round];
 if(x){const xv=str(x),win=h.find(o=>o.v>xv);if(win)return win.i;const eq=h.find(o=>o.v===xv);if(eq&&G.results.includes('c'))return eq.i;return h[0].i}
 if(G.round===0)return h.length===3?h[1].i:h[h.length-1].i;
 return h[h.length-1].i}
function cpuTurn(){if(!G||G.handOver||G.pending||G.turn!=='c')return;
 const e=envPts(G.orig.c),r=Math.random();
 if(canEnvido('c')&&!G.cpuEnvTried){G.cpuEnvTried=true;let k=null;
  if(e>=31)k=(r<.3||(G.sp-G.sc>=5&&r<.6))?'F':r<.65?'R':'E';else if(e>=28)k=r<.85?(r<.25?'R':'E'):null;else if(e>=25)k=r<.35?'E':null;else k=r<.07?'E':null;
  if(k){callEnvido('c',k);return}}
 if(canRaiseTruco('c')&&!G.cpuTr[G.round]){G.cpuTr[G.round]=true;const pw=cpuPower();if(pw>.62+(G.truco.lvl-1)*.08||Math.random()<.06){callTruco('c');return}}
 playCard('c',chooseCard())}
function cpuRespond(){const P=G.pending;if(!P||G.handOver||other(P.by)!=='c')return;const r=Math.random();
 if(P.t==='env'){const e=envPts(G.orig.c)+(G.mano==='c'?.5:0),last=P.chain[P.chain.length-1],opts=envOptions(P.chain);
  if(e>=32&&opts.length&&r<.6){callEnvido('c',e>=33&&opts.includes('F')?'F':opts.includes('R')?'R':opts[0]);return}
  const need=(last==='F'?30:last==='R'?28:27)+(P.chain.length>1?1:0);
  respEnv('c',(e>=need||r<.06)?'q':'n');return}
 if(P.lvl===2&&canEnvido('c')&&!G.cpuEnvTried){G.cpuEnvTried=true;const e=envPts(G.orig.c);
  if(e>=28||(e>=26&&r<.4)){callEnvido('c',e>=31&&r<.5?'R':'E');return}}
 const pw=cpuPower(),lose=G.sp+G.truco.lvl>=G.target;
 if(pw>.78&&P.lvl<4&&r<.6){respTruco('c','r');return}
 respTruco('c',(pw>=.45||lose||r<.12)?'q':'n')}

/* ---- Vista ---- */
function cardHTML(c,tag='div',attrs=''){return `<${tag} class="card s-${c.s}" ${attrs} aria-label="${c.n} de ${c.s}"><span class="n">${c.n}</span>${ICON[c.s]}<span class="n n2">${c.n}</span></${tag}>`}
function scoreLbl(s){if(G.target!==30)return'';return s<15?`<i>${s} malas</i>`:`<i>${s-15} buenas</i>`}
function render(){if(!G)return;
 const sp=Math.min(G.sp,G.target),sc=Math.min(G.sc,G.target);
 const val=G.truco.lvl>1?TL[G.truco.lvl]+' · '+G.truco.lvl+' pts':'Mano vale 1';
 $('top').innerHTML=`<div class="sc"><span>Vos</span><b>${G.target===30?'':sp}</b>${G.target===30?`<b>${sp}</b>`:''}${scoreLbl(sp)}</div>
  <div class="mid"><strong>A ${G.target}</strong>${val}<br>Mano: ${WHO[G.mano]}</div>
  <div class="sc"><span>Compu</span><b>${sc}</b>${scoreLbl(sc)}</div>`;
 $('cpu').innerHTML=G.hand.c.map(()=>'<div class="card back"></div>').join('');
 $('sayc').innerHTML=G.say.c?`<div><small>Compu</small>${G.say.c}</div>`:'';
 $('sayp').innerHTML=G.say.p?`<div><small>Vos</small>${G.say.p}</div>`:'';
 $('tbl').innerHTML=[0,1,2].map(i=>{const c=G.played.c[i],p=G.played.p[i],r=G.results[i];
  const lab=r==='p'?'<div class="res w">Ganaste</div>':r==='c'?'<div class="res l">Compu</div>':r==='t'?'<div class="res">Parda</div>':'<div class="res"></div>';
  return `<div class="baza">${c?cardHTML(c):'<div class="slot"></div>'}${p?cardHTML(p):'<div class="slot"></div>'}${lab}</div>`}).join('');
 $('note').textContent=G.note;
 const P=G.pending,myTurn=G.turn==='p'&&!P&&!G.handOver,resp=P&&other(P.by)==='p'&&!G.handOver;
 $('me').className='hand me'+(myTurn?' on':'');
 $('me').innerHTML=G.hand.p.map((c,i)=>cardHTML(c,'button',`data-a="play" data-i="${i}" ${myTurn?'':'disabled'}`)).join('');
 $('status').textContent=G.handOver?'':resp?'Te cantaron, respondé:':myTurn?`Te toca · tenés ${envPts(G.orig.p)} de envido`:'Piensa la Compu…';
 let h='';
 if(resp){
  h+=`<div class="row"><button class="q" data-a="q">Quiero</button><button data-a="n">No quiero</button></div>`;
  if(P.t==='env'){const o=envOptions(P.chain);if(o.length)h+=`<div class="row">${o.map(k=>`<button class="env" data-a="env" data-k="${k}">${EN[k]}</button>`).join('')}</div>`}
  else{if(P.lvl<4)h+=`<div class="row"><button class="tr" data-a="r">${TN[P.lvl+1].replace(/[¡!]/g,'')}</button></div>`;
   if(P.lvl===2&&canEnvido('p'))h+=`<div class="lbl">El envido está primero</div><div class="row">${['E','R','F'].map(k=>`<button class="env" data-a="env" data-k="${k}">${EN[k]}</button>`).join('')}</div>`}
 }else if(!G.handOver){
  const ce=myTurn&&canEnvido('p');
  h+=`<div class="row">${['E','R','F'].map(k=>`<button class="env" data-a="env" data-k="${k}" ${ce?'':'disabled'}>${EN[k]}</button>`).join('')}</div>`;
  const ct=myTurn&&canRaiseTruco('p');
  h+=`<div class="row"><button class="tr" data-a="tr" ${ct?'':'disabled'}>${TL[Math.min(G.truco.lvl+1,4)]}</button><button data-a="mazo" ${myTurn?'':'disabled'}>Irse al mazo</button></div>`;
 }
 $('acts').innerHTML=h}

function showHand(){G.ended=true;const a=G.awards;
 $('box').innerHTML=`<h2>Fin de la mano</h2><ul>${a.map(x=>`<li><span>${x.why}</span><b>${WHO[x.w]} +${x.pts}</b></li>`).join('')}</ul>
  <p>Cartas de la Compu:</p><div class="mini">${G.orig.c.map(c=>cardHTML(c)).join('')}</div>
  <div class="big">${Math.min(G.sp,G.target)} – ${Math.min(G.sc,G.target)}</div>
  <div class="row"><button data-a="next">Repartir</button></div>`;
 $('ov').hidden=false;$('box').querySelector('button').focus()}
function showEnd(){const win=G.sp>=G.target;
 $('box').innerHTML=`<h1>${win?'¡Ganaste!':'Ganó la Compu'}</h1><div class="big">${Math.min(G.sp,G.target)} – ${Math.min(G.sc,G.target)}</div>
  <ul>${G.awards.map(x=>`<li><span>${x.why}</span><b>${WHO[x.w]} +${x.pts}</b></li>`).join('')}</ul>
  <div class="row"><button data-a="start" data-t="15">Otra a 15</button><button class="alt" data-a="start" data-t="30">Otra a 30</button></div>`;
 $('ov').hidden=false}
function showStart(){$('box').innerHTML=`<h1>Truco</h1><p>Vos contra la Compu, mano a mano. Envido, real envido, falta envido, truco, retruco y vale cuatro. Se juega sin flor.</p>
  <div class="row"><button data-a="start" data-t="15" ${lastTarget===15?'autofocus':''}>Partida a 15</button><button class="alt" data-a="start" data-t="30">Partida a 30</button></div>
  <small>Tocá una carta para jugarla. Los cantos aparecen abajo cuando te toca.</small>`;$('ov').hidden=false}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;
 if(a==='start')return newMatch(+b.dataset.t);
 if(a==='next')return newHand();
 if(!G||G.handOver)return;const P=G.pending;
 if(P&&other(P.by)==='p'){
  if(a==='env')return respondEnvOrCall(b.dataset.k);
  if(P.t==='env'&&(a==='q'||a==='n'))return respEnv('p',a);
  if(P.t==='tr'&&(a==='q'||a==='n'||a==='r'))return respTruco('p',a);
  return}
 if(P||G.turn!=='p')return;
 if(a==='play')return playCard('p',+b.dataset.i);
 if(a==='env'&&canEnvido('p'))return callEnvido('p',b.dataset.k);
 if(a==='tr'&&canRaiseTruco('p'))return callTruco('p');
 if(a==='mazo')return mazo('p')});
function respondEnvOrCall(k){const P=G.pending;if(P.t==='env')respEnv('p',k);else if(canEnvido('p'))callEnvido('p',k)}
showStart();
}
</script>
</body></html>
