<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anotador de truco</title>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: pizarra de bodegón, a mano
IDEA: los fósforos en cuadraditos de cinco, como se anota en la mesa
PICTURE: dos columnas de fósforos que se van armando
COLOUR and TYPE: pizarra verde oscura, palito madera, cabeza roja; Alfa Slab One + Barlow
LAYOUT: nombres y puntos arriba, fósforos al centro, botones grandes abajo */
:root{color-scheme:dark;--bg:#1c2b25;--bg2:#24372f;--ink:#f1ede2;--stick:#e8c78a;--head:#e2483a;--gold:#f3c34f}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:12px 12px 20px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.bar h1{font:22px/1 'Alfa Slab One',serif;margin:0;flex:1}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px}
.seg button{min-height:40px;padding:0 14px;border-radius:9px;background:none;font-weight:700}
.seg button.on{background:var(--gold);color:#2a1d05}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.col{background:var(--bg2);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;border:2px solid transparent}
.col.win{border-color:var(--gold)}
.col input{width:100%;background:transparent;border:0;border-bottom:2px dashed rgba(255,255,255,.25);text-align:center;font-weight:700;font-size:18px;padding:4px}
.pts{font:46px/1 'Alfa Slab One',serif;color:var(--gold)}
.sub{font-size:13px;opacity:.75;height:18px}
.boxes{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0}
.boxes svg{width:min(26vw,76px);height:min(26vw,76px);display:block}
.sep{width:100%;text-align:center;font-size:13px;letter-spacing:.02em;opacity:.8;border-top:2px solid rgba(255,255,255,.3);padding-top:3px;margin:4px 0}
.plus{width:100%;min-height:64px;border-radius:14px;background:var(--head);font:28px/1 'Alfa Slab One',serif;box-shadow:0 4px 0 #8f241b}
.plus:active{transform:translateY(3px);box-shadow:0 1px 0 #8f241b}
.minus{display:flex;gap:6px;width:100%}
.minus button{flex:1;min-height:44px;border-radius:12px;background:rgba(255,255,255,.1);font-weight:700}
.wins{font-size:13px;opacity:.8}
.foot{display:flex;gap:8px;margin-top:12px}
.foot button{flex:1;min-height:48px;border-radius:12px;background:var(--bg2);font-weight:700;border:2px solid rgba(255,255,255,.15)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.ov[hidden]{display:none}
.box{background:var(--ink);color:#1c2b25;border-radius:18px;padding:22px;max-width:360px;width:100%;text-align:center}
.box h2{font:30px/1.05 'Alfa Slab One',serif;margin:0 0 8px}
.box .r{display:flex;gap:8px;margin-top:14px}
.box button{flex:1;min-height:48px;border-radius:12px;background:#1c2b25;color:var(--ink);font-weight:700}
.box button.alt{background:#fff;color:#1c2b25;border:2px solid #1c2b25}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app">
 <div class="bar"><h1>Anotador</h1><div class="seg" id="seg"><button data-t="15">15</button><button data-t="30">30</button></div></div>
 <div class="cols" id="cols"></div>
 <div class="foot"><button id="undo">Deshacer</button><button id="reset">Nueva partida</button></div>
</div>
<div class="ov" id="ov" hidden><div class="box" id="box"></div></div>
<script>
{
const KEY='anotador-truco';
let S={names:['Nosotros','Ellos'],target:30,s:[0,0],hist:[],wins:[0,0],done:false};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.s)S={...S,...x}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// palitos: arriba, derecha, abajo, izquierda, diagonal
const L=[[10,9,50,11],[51,10,49,50],[50,51,10,49],[9,50,11,10],[13,47,47,13]];
function stick(l){const[x1,y1,x2,y2]=l;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#e8c78a" stroke-width="4" stroke-linecap="round"/><circle cx="${x2}" cy="${y2}" r="3.8" fill="#e2483a"/>`}
function boxSVG(n){return `<svg viewBox="0 0 60 60" aria-hidden="true"><rect x="4" y="4" width="52" height="52" rx="6" fill="none" stroke="rgba(255,255,255,.07)"/>${L.slice(0,n).map(stick).join('')}</svg>`}
function col(i){const s=S.s[i],nb=S.target/5;let b='';
 for(let k=0;k<nb;k++){if(S.target===30&&k===3)b+='<div class="sep">buenas</div>';b+=boxSVG(Math.max(0,Math.min(5,s-5*k)))}
 const sub=S.target===30?(s<15?`${s} malas`:`${s-15} buenas`):'';
 return `<div class="col${S.done&&s>=S.target?' win':''}"><input value="${esc(S.names[i])}" data-n="${i}" maxlength="16" aria-label="Nombre del equipo">
  <div class="pts">${s}</div><div class="sub">${sub}</div>
  <div class="boxes">${b}</div>
  <button class="plus" data-add="${i}" data-v="1" aria-label="Sumar 1 a ${esc(S.names[i])}">+1</button>
  <div class="minus"><button data-add="${i}" data-v="2">+2</button><button data-add="${i}" data-v="3">+3</button><button data-add="${i}" data-v="-1">−1</button></div>
  <div class="wins">Partidas ganadas: ${S.wins[i]}</div></div>`}
function render(){$('cols').innerHTML=col(0)+col(1);
 document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',+b.dataset.t===S.target))}
function add(i,v){if(S.done&&v>0)return;const before=S.s[i];S.s[i]=Math.max(0,Math.min(S.target,S.s[i]+v));
 if(S.s[i]===before)return;S.hist.push([i,S.s[i]-before]);
 if(S.s[i]>=S.target){S.done=true;S.wins[i]++;S.hist.push(['w',i]);showWin(i)}
 save();render()}
function undo(){const h=S.hist.pop();if(!h)return;
 if(h[0]==='w'){S.wins[h[1]]--;S.done=false;const p=S.hist.pop();if(p)S.s[p[0]]-=p[1]}
 else S.s[h[0]]-=h[1];
 $('ov').hidden=true;save();render()}
function reset(){S.s=[0,0];S.hist=[];S.done=false;$('ov').hidden=true;save();render()}
function showWin(i){$('box').innerHTML=`<h2>¡Ganó ${esc(S.names[i])}!</h2><p>${S.s[0]} a ${S.s[1]}</p><div class="r"><button id="again">Nueva partida</button><button class="alt" id="back">Deshacer</button></div>`;$('ov').hidden=false;$('again').focus()}
document.addEventListener('click',e=>{const t=e.target;
 const a=t.closest('[data-add]');if(a){add(+a.dataset.add,+a.dataset.v);return}
 const sg=t.closest('#seg button');if(sg){const nt=+sg.dataset.t;if(nt!==S.target){S.target=nt;reset()}return}
 if(t.id==='undo'||t.id==='back')return undo();
 if(t.id==='reset'||t.id==='again')return reset()});
document.addEventListener('input',e=>{const n=e.target.dataset.n;if(n!=null){S.names[+n]=e.target.value||'Equipo';save()}});
render();
}
</script>
</body></html>
