plugins { id 'com.android.application' }
android {
    namespace 'ar.truco.app'
    compileSdk 34
    defaultConfig {
        applicationId 'ar.truco.app'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '2.1'
    }
    signingConfigs {
        fija {
            storeFile file('truco-debug.keystore')
            storePassword 'android'
            keyAlias 'trucodebug'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fija }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
